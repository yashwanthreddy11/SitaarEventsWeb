<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitaar Events</title>
   
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <section class="container my-5">
        <div class="message2">
        <h2 class="text-center mb-4">We Value Your Feedback</h2>
        <p class="text-center text-muted mb-5">Your feedback helps us grow and serve you better. Please share your thoughts with us!</p>
      
        <form class="needs-validation" action="your-feedback-handler.php" method="POST" novalidate>
          <div class="row g-4">
            <div>
              <label for="name" class="form-label">Your Name *</label>
              <input type="text" class="form-control" id="name" name="name" required>
              <div class="invalid-feedback">Please enter your name.</div>
            </div>
      
            <div>
              <label for="email" class="form-label">Email Address *</label>
              <input type="email" class="form-control" id="email" name="email" required>
              <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>
      
            <div>
              <label for="eventName" class="form-label">Event Name *</label>
              <input type="text" class="form-control" id="eventName" name="eventName" required>
              <div class="invalid-feedback">Please specify the event you attended.</div>
            </div>
      
            <div>
              <label for="rating" class="form-label">Overall Rating *</label>
              <select class="form-select" id="rating" name="rating" required>
                <option selected disabled value="">Choose...</option>
                <option>Excellent</option>
                <option>Very Good</option>
                <option>Good</option>
                <option>Average</option>
                <option>Poor</option>
              </select>
              <div class="invalid-feedback">Please select a rating.</div>
            </div>
      
            <div>
              <label for="feedback" class="form-label">Your Feedback *</label>
              <textarea class="form-control" id="feedback" name="feedback" rows="5" placeholder="Share your experience..." required></textarea>
              <div class="invalid-feedback">Please share your feedback.</div>
            </div>
      
            <div class="col-12 text-center">
              <button type="submit" class="btn btn-primary mt-4 px-5">Submit Feedback</button>
            </div>
          </div>
        </form>

    </div>

      </section>
      
      <!-- Bootstrap Validation Script -->
      <script>
        (() => {
          'use strict';
      
          const forms = document.querySelectorAll('.needs-validation');
      
          Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
              if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
              }
      
              form.classList.add('was-validated');
            }, false);
          });
        })();
      </script>
      
</body>
